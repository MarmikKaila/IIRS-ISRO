# ── WV channel — water-vapour brightness temperature ────────────────────────
channel: wv
source_dir: sample-images/Jan26_168372
file_glob: "*_IMG_WV.tif"

# Output locations (relative to repo root) — self-contained under wv/
latent_dir: wv/latents
manifest_path: wv/manifest.csv
checkpoint_dir: wv/checkpoints
output_dir: wv/outputs

# Image preprocessing — resize 888x968 -> 256x288 (W x H), aspect-preserving.
# Both dims divisible by 8 -> SD-VAE latent 4 x 36 x 32.
resize_height: 288
resize_width: 256

# Normalization to [-1, 1]. low/high are robust 1st/99th percentiles.
# Auto-filled by encode_latents.py on first run; edit to pin them.
norm:
  low: null
  high: null

# Pretrained SD-VAE checkpoint
vae_model: stabilityai/sd-vae-ft-mse
latent_scaling_factor: 0.18215   # used if vae.config.scaling_factor is missing

# Day/night handling — DISABLED for WV (usable 24 h, all 48 slots modelled).
day_night:
  enabled: false
  scene_lat: 21.0
  scene_lon: 79.0
  elevation_threshold_deg: 0.0

# RNN input sequence
sequence:
  input_len: 8             # T past latents fed to the ConvLSTM
  cadence_minutes: 30

# ConvLSTM training
train:
  num_layers: 2
  hidden_dims: [64, 64]
  kernel_size: 3
  batch_size: 16
  epochs: 60
  lr: 0.0003
  weight_decay: 0.0
  val_fraction: 0.1
  test_fraction: 0.1
  scheduled_sampling: true   # mix in model predictions during training
  unroll_steps: 3            # short multi-step unroll for rollout robustness
  seed: 42

# 48-frame day forecast
forecast:
  horizon: 48

# Latent flow-matching model (Stage 3-flow / Stage 4-flow).
# 2-level U-Net (see src/models/flow_model.py) with bottleneck attention.
# Training-hygiene keys (warmup_frac, ema_decay, unroll_steps, unroll_prob)
# are read by src/train_flow.py with safe defaults — listed here for clarity.
flow:
  hidden: 96          # base channel count (bottleneck = 2 * hidden = 192)
  n_blocks: 2         # ResBlocks per U-Net level (enc0, enc1, dec0)
  t_dim: 128          # time-embedding dimension
  use_attn: true      # 1-head self-attention at the bottleneck (18x16)
  batch_size: 32
  epochs: 80
  lr: 0.0002
  weight_decay: 1.0e-4
  ode_steps: 10       # Euler steps per sample at forecast time
  seed: 42

  warmup_frac: 0.05
  ema_decay: 0.999
  unroll_steps: 2
  unroll_prob: 0.3
